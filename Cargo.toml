[package]
name = "molt"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Molt - a local-first terminal UI and CLI for managing Python virtual environments and running code."
license = "MIT"
readme = "README.md"
keywords = ["python", "venv", "tui", "cli", "uv"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "molt"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
